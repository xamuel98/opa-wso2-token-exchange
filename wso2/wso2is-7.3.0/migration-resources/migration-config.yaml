   migratorConfigs:
   -
     name: "ApplicationAccessURLMigrator"
     order: 1
     # parameters:
       # Absolute path for the dry report. This is required in the dry run mode.
       # reportPath:

   - name: "SchemaMigrator"
     order: 2
     parameters:
       location: "step1"
       schema: "identity"

   - name: "SchemaMigrator"
     order: 3
     parameters:
       location: "step2"
       schema: "identity"

   - name: "SchemaMigrator"
     order: 4
     parameters:
       location: "step3"
       schema: "consent"

