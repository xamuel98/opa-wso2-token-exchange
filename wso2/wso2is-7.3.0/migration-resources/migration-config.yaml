       schema: "identity"
   - name: "SchemaMigrator"
     order: 7
     parameters:
       location: "step3"
       schema: "um"
   - name: "SchemaMigrator"
     order: 8
     parameters:
       location: "step3"
       schema: "identity"
   - name: "UserPortalDataMigrator"
     order: 9
     parameters:
       location: "step4"
       schema: "identity"
   - name: "UserPortalDataMigrator"
     order: 10
     parameters:
       location: "step4"
