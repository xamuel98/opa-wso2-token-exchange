migrationEnable: "true"

# Migration Start Version
currentVersion: "6.x.x"
# Migration End Version
migrateVersion: "7.x.x"

# Enable Residual Migration
isResidualMigration: "false"

continueOnError: "false"
batchUpdate: "true"
ignoreForInactiveTenants: "true"
isSeparateRegistryDB: "false"

migrateTenantRange: "false"
migrationStartingTenantID: "0"
migrationEndingTenantID: "0"

exitOnComplete: "false"

isForceRerun: "false"

versions:
 -
  version: "5.0.0-SP1"
  migratorConfigs:
   -
    name: "SchemaMigrator"
    order: 1
    parameters:
      location: "step1"
      schema: "identity"
 -
  version: "5.1.0"
  migratorConfigs:
   -
    name: "IdentityDataCleaner"
    order: 1
    parameters:
      schema: "identity"
   -
    name: "SchemaMigrator"
    order: 2
    parameters:
      location: "step1"
      schema: "identity"
   -
    name: "SchemaMigrator"
    order: 3
    parameters:
      location: "step1"
      schema: "um"
   -
    name: "IdentityDataMigrator"
    order: 4
    parameters:
      schema: "identity"
   -
