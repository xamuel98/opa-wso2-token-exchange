       location: "step7"
       schema: "um"

   - name: "SchemaMigrator"
     order: 13
     parameters:
       location: "step7"
       schema: "reg"

   - name: "RecoveryDataMigrator"
     order: 14
     parameters:
       batchSize: 10000
       # Wait time in milliseconds between batches.
       waitTime: 200
       # Optional: Starting batch number to resume migration from a failed batch.
       # startBatch: 1

   - name: "SCIMGroupSchemaMigrator"
     order: 15
     parameters:
       location: "step8"
       schema: "identity"
       # Absolute path for the dry report. This is required in the dry run mode.
       # reportPath:

   - name: "SystemAppMigrator"
     order: 16
     parameters:
        consoleRedirectUrl: "regexp=(<PROTOCOL>://<HOSTNAME>:<PORT>/console|<PROTOCOL>://<HOSTNAME>:<PORT>/t/(.*)/console)"
        consoleAccessUrl: "<PROTOCOL>://<HOSTNAME>:<PORT>/console"
        myaccountRedirectUrl: "regexp=(<PROTOCOL>://<HOSTNAME>:<PORT>/myaccount|<PROTOCOL>://<HOSTNAME>:<PORT>/t/(.*)/myaccount)"
        myaccountAccessUrl: "<PROTOCOL>://<HOSTNAME>:<PORT>/myaccount"
        accessTokenBindingType: "cookie"

   - name: "AppInboundAuthMigrator"
     order: 17

   - name: "OIDCScopeDataMigrator"
     order: 18

   - name: "TOTPClaimDataMigrator"
     order: 19
   - name: "RoleClaimMigrator"
     order: 20
     parameters:
         # Absolute path for the dry report. This is required in the dry run mode.
         # reportPath:
         # Based on the dry-run execution, if you decide to migrate the role claims, set the value to true.
         migrateRoleClaim: false
   - name: "SpRoleMappingMigrator"
     order: 21
     parameters:
       reportPath: <absolute-path>
 -
   version: "6.1.0"
   migratorConfigs:
     - name: "SchemaMigrator"
       order: 1
       parameters:
         location: "step1"
         schema: "identity"
     - name: "UMAGrantMigrator"
       order: 2
       parameters:
         # UMA grant is removed from OAuth apps since UMA grant is not supported out of the box from IS 6.1.0.
         # If the UMA connector is used, set the value to false.
         removeUMAGrantFromApps: true
 -
   version: "7.0.0"
   migratorConfigs:
     - name: "OAuth2ScopeGroupRoleMigrator"
       order: 1
     - name: "ClientIdTenantUnificationMigrator"
       order: 2
       parameters:
         # Absolute path for the dry report. This is required in the dry run mode.
         reportPath: <absolute-path>
     - name: "SchemaMigrator"
       order: 3
       parameters:
         location: "step1"
         schema: "identity"
     - name: "SchemaMigrator"
       order: 4
       parameters:
         location: "step1"
         schema: "um"
     - name: "SchemaMigrator"
       order: 5
       parameters:
         location: "step1"
         schema: "reg"
     - name: "SchemaMigrator"
       order: 6
       parameters:
         location: "step2"
         schema: "identity"
     - name: "SPAppVersionColumnMigrator"
       order: 7
       parameters:
         location: "step1"
         schema: "identity"
         retrieveFromCommonResources: "true"
     - name: "LegacyToNewRuntimeMigrator"
       order: 8
       parameters:
         # Absolute path for the dry report. This is required in the dry run mode.
         reportPath: <absolute-path>
         # Based on the dry-run execution, if you decide not to subscribe to all APIs (Option 3), set the value to false.
         subscribeAllAPIs: "true"
         # Whether to skip the migration of non-scoped permissions. If set to true, only the permissions associated with a scope will be migrated.
         skipNonScopedPermissionMigration: "false"
     - name: "ClaimDataMigrator"
       order: 9
       parameters:
         overrideExistingClaims: "true"
         useOwnClaimDataFile: "false"
     - name: "ConsoleRoleMigrator"
       order: 10
       parameters:
         # Absolute path for the dry report. This is required in the dry run mode.
         reportPath: <absolute-path>
     - name: "EmailTemplateDataMigrator"
       order: 11
     - name: "GroupUUIDMigrator"
       order: 12
       parameters:
         # Absolute path for the dry report. This is required in the dry run mode.
         reportPath: <absolute-path>
     - name: "CustomClaimDialectMigrator"
       order: 13
       parameters:
         # Absolute path for the dry report. This is required in the dry run mode.
         # reportPath:
     - name: "RoleClaimMigrator"
       order: 14
       parameters:
         # Absolute path for the dry report. This is required in the dry run mode.
         # reportPath:
         # When migrating to IS 7.0.0, role claim migrator is mandatory.
         migrateRoleClaim: true
     - name: "FederateSessionMappingMigrator"
       order: 15
       parameters:
          # Absolute path for the dry report. This is required in the dry run mode.
          reportPath: <absolute-path>
     - name: "SAMLAuthnContextMigrator"
       order: 16
     - name: "IdpRoleMappingMigrator"
       order: 17
       parameters:
         enable: "false"
         reportPath: ""
